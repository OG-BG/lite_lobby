        // Read auth params from URL (passed by launcher) - manual parser for old Coherent GT
        var _authToken = '', _authUser = '';
        try {

            var _pairs = _qs.split('&');
            for (var i = 0; i < _pairs.length; i++) {
                var _kv = _pairs[i].split('=');
                if (_kv[0] === 'token') _authToken = decodeURIComponent(_kv[1] || '');
                if (_kv[0] === 'user') _authUser = decodeURIComponent(_kv[1] || '');
            }
        } catch(e) {}
        var _wsTokenSuffix = _authToken ? '?token=' + encodeURIComponent(_authToken) : '';

                antiCheatSolution: "be",
                appId: "lpc"
            };
            // Define GetClientAuthData as a getter that returns mock data
            // The engine might set this later (when isAttached), so use defineProperty
            var _engine = window.engine || {};
            if (!_engine.GetClientAuthData) {
                Object.defineProperty(_engine, 'GetClientAuthData', {
                    get: function() { return mockAuthData; },
                    configurable: true
                });
            }
            if (!_engine.GetGameVersion) {
                Object.defineProperty(_engine, 'GetGameVersion', {
                    get: function() { return "1.4.0"; },
                    configurable: true
                });
            }
            if (!_engine.GetCurrentCultureName) {
                Object.defineProperty(_engine, 'GetCurrentCultureName', {
                    get: function() { return "en_US"; },

                });
            }
            if (!_engine.GetOsLanguage) {
                Object.defineProperty(_engine, 'GetOsLanguage', {
                    get: function() { return "en-US"; },
                    configurable: true
                });
            }
            window.engine = _engine;
        })();
